# Usamos Node.js para compilar los assets (npm run build)
# Usamos PHP 8.2, Composer y la extensión 'zip' para el proyecto
nixPkgs = ['nodejs_20', 'php82', 'php82Packages.composer']

# Configuración de extensiones PHP
[nixpkgsOverlay]
php82 = "php82.withExtensions ({ enabled, all }: enabled ++ (with all; [ zip opcache pdo_pgsql redis sodium ]))"

[phases.setup]
nixPkgs = ['...', 'unzip']

[phases.install]
# Instalación de dependencias de PHP y JavaScript
cmds = [
    'composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction', 
    'npm ci --production=false'
]

[phases.build]
cmds = [
    # 1. Compilación de assets de frontend
    'npm run build',
    
    # 2. Solo comandos de caché y enlaces de storage de Laravel
    'php artisan optimize:clear',
    'php artisan config:cache',
    'php artisan route:cache', 
    'php artisan view:cache',
    'php artisan storage:link || true',
    
    'echo "=== Build phase completed - Base de datos movida a Release Command ==="'
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'