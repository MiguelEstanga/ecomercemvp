[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
    "composer install  ",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "ls -la public/build",  # Verificar que se generaron los assets
    "chmod -R 775 storage bootstrap/cache",
    "chmod -R 775 storage"
    "php artisan config:cache",
    "php artisan route:cache",

]

[start]
cmd = "php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"