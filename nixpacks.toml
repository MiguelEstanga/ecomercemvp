[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
    "composer install",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "ls -la public/build",
    "php artisan config:cache",
    "php artisan route:cache",
]

[start]
cmd = """
    mkdir -p storage/app/public storage/app/private storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && \
    chmod -R 775 storage bootstrap/cache && \
    php artisan migrate --force && \
    php artisan storage:link --force && \
    php artisan config:clear && \
    php artisan serve --host=0.0.0.0 --port=${PORT:-8080}
"""