[phases.setup]
nixPkgs = ['nodejs_20', 'php82', 'php82Packages.composer']
aptPkgs = ['php-cli', 'php-gd', 'php-intl', 'php-pgsql', 'php-mbstring', 'php-zip']

[phases.install]
cmds = [
    'composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --ignore-platform-reqs',
    'npm ci --production=false'
]

[phases.build]
cmds = [
    'npm run build',
    'mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache',
    'chmod -R 775 storage bootstrap/cache'
]

[start]
cmd = 'php artisan migrate:fresh --force && php artisan db:seed --force && php artisan optimize && php -S 0.0.0.0:$PORT -t public'