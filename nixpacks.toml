[build]
nixPkgs = [
  "php82",
  "php82Packages.composer",
  "php82Extensions.zip",
  "nodejs_20"
]

[phases.install]
cmds = [
  "composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction",
  "npm ci --production=false"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan optimize && php -S 0.0.0.0:$PORT -t public"
