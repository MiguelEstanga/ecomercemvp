nixPkgs = ['nodejs_20', 'php82', 'php82Packages.composer', 'php82Extensions.zip']

[phases.install]
cmds = [
    'composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --ignore-platform-reqs', 
    'npm ci --production=false'
]

[phases.build]
cmds = [
    'npm run build',
    'echo "Build completado - comandos de Laravel movidos al start"'
]

[start]
cmd = 'php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT'